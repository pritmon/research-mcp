name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!

  - type: dropdown
    id: tool
    attributes:
      label: Which tool is affected?
      options:
        - summarize_url / POST /summarize
        - search_and_summarize / POST /search
        - extract_entities / POST /entities
        - compare_sources / POST /compare
        - MCP server (stdio)
        - HTTP server / demo UI
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug clearly.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Call POST /summarize with URL "..."
        2. See error "..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "e.g. 20.11.0"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      render: shell
